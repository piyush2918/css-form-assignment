<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Info</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <div class="page-wrapper">

    
    <div class="form-card">
      <form id="userForm">

        <h2>Personal Info</h2>
        <p class="subtitle">Update your personal details here</p>

        <!-- Name -->
        <label>Name</label>
        <input type="text" id="name" placeholder="Your name" />

        <!-- Email -->
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Your email address" />

        <!-- Age & Phone -->
        <div class="two-column">
          <div>
            <label>Age</label>
            <input type="number" id="age" placeholder="Your age" />
          </div>
          <div>
            <label>Phone no.</label>
            <input type="tel" id="telephone" placeholder="Your phone no." />
          </div>
        </div>

        <!-- Country -->
        <label>Country</label>
        <select id="country">
          <option value="">Your country</option>
          <option value="India">India</option>
          <option value="USA">USA</option>
          <option value="Japan">Japan</option>
          <option value="China">China</option>
        </select>

        <!-- Gender -->
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" /> Male</label>
          <label><input type="radio" name="gender" value="Female" /> Female</label>
          <label><input type="radio" name="gender" value="Other" /> Other</label>
        </div>

        <!-- Tech Stack -->
        <label>Tech Stack</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="HTML" /> HTML</label>
          <label><input type="checkbox" value="CSS" /> CSS</label>
          <label><input type="checkbox" value="JS" /> JS</label>
          <label><input type="checkbox" value="React" /> React</label>
          <label><input type="checkbox" value="React Native" /> React Native</label>
        </div>

        <!-- Address -->
        <label>Address</label>
        <textarea id="address" rows="4" placeholder="Your address"></textarea>

        <!-- Buttons -->
        <div class="button-group">
          <button type="reset">Reset</button>
          <button type="button" onclick="handleSubmit()">Submit</button>
        </div>

      </form>
    </div>

    <!-- TABLE SECTION -->
    <div class="table-section">
      <h3>Submitted Data</h3>

      <table id="resultTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Country</th>
            <th>Tech Stack</th>
            <th>Address</th>
            <th>Telephone</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
